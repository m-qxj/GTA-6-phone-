name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export (Debug)
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Move export templates into place
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION} \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}
        env:
          GODOT_VERSION: 4.3.stable

      - name: Generate a debug keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Create build directory
        run: mkdir -v -p build/android

      - name: Export debug APK
        run: godot --headless --verbose --export-debug "Android" build/android/opencity-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencity-debug-apk
          path: build/android/opencity-debug.apk
