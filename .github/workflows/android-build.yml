name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export (Debug)
    runs-on: ubuntu-22.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION} \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}
        env:
          GODOT_VERSION: 4.3.stable

      - name: Install Android Build Tools
        run: |
          # Install build tools matching the target SDK version
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;33.0.2" "platforms;android-33"
        env:
          ANDROID_HOME: /root/android-sdk

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot
          SDK_PATH=${ANDROID_HOME:-/root/android-sdk}
          JAVA_PATH=${JAVA_HOME:-/usr/lib/jvm/java-17-openjdk-amd64}

          cat << EOF > ~/.config/godot/editor_settings-4.tres
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "${SDK_PATH}"
export/android/java_sdk_path = "${JAVA_PATH}"
export/android/jdk_path = "${JAVA_PATH}"
export/android/debug_keystore = "/root/.android/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF

      - name: Verify Godot Configuration
        run: |
          # Verify export templates are in place
          ls -la ~/.local/share/godot/export_templates/
          # Verify keystore exists
          ls -la ~/.android/debug.keystore
          # Verify editor settings
          cat ~/.config/godot/editor_settings-4.tres

      - name: Build Android APK
        run: |
          cd opencity-prototype
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/opencity-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencity-debug-apk
          path: opencity-prototype/build/android/opencity-debug.apk
