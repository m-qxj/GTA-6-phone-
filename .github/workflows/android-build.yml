name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export (Debug)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Android SDK, Templates, and Keystore
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/4.3.stable
          mkdir -p /root/.local/share/godot/export_templates/4.3.stable

          if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            cp -r /root/.local/share/godot/export_templates/4.3.stable/* /github/home/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || true
          fi

          if [ ! -f "/github/home/.local/share/godot/export_templates/4.3.stable/android_debug.apk" ]; then
            wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            unzip -q Godot_v4.3-stable_export_templates.tpz
            mv templates/* /github/home/.local/share/godot/export_templates/4.3.stable/
            cp -r /github/home/.local/share/godot/export_templates/4.3.stable/* /root/.local/share/godot/export_templates/4.3.stable/
            rm -rf templates Godot_v4.3-stable_export_templates.tpz
          fi

          mkdir -p /github/home/.android /root/.android
          rm -f /github/home/debug.keystore /root/debug.keystore
          keytool -genkey -v -keystore /github/home/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp /github/home/debug.keystore /root/debug.keystore

          export ANDROID_HOME=/root/android-sdk
          mkdir -p $ANDROID_HOME
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;33.0.2" "platforms;android-33" || true

          JAVA_BIN=$(readlink -f $(which java) 2>/dev/null || true)
          if [ -n "$JAVA_BIN" ]; then
            JDK_PATH=$(dirname $(dirname "$JAVA_BIN"))
          else
            JDK_PATH="/usr/lib/jvm/java-17-openjdk-amd64"
          fi

          CONFIG_DIRS="/github/home/.config/godot /root/.config/godot"
          for DIR in $CONFIG_DIRS; do
            mkdir -p "$DIR"
            cat << EOF > "$DIR/editor_settings-4.tres"
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "${ANDROID_HOME}"
export/android/java_sdk_path = "${JDK_PATH}"
export/android/debug_keystore = "/github/home/debug.keystore"
export/android/debug_keystore_user = "androiddebugkey"
export/android/debug_keystore_pass = "android"
EOF
            cp "$DIR/editor_settings-4.tres" "$DIR/editor_settings-4.3.tres"
          done

          sed -i 's|^keystore/debug=.*|keystore/debug="/github/home/debug.keystore"|g' opencity-prototype/export_presets.cfg
          sed -i 's|^keystore/debug_user=.*|keystore/debug_user="androiddebugkey"|g' opencity-prototype/export_presets.cfg
          sed -i 's|^keystore/debug_password=.*|keystore/debug_password="android"|g' opencity-prototype/export_presets.cfg

      - name: Build Android APK
        run: |
          cd opencity-prototype
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/opencity-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencity-debug-apk
          path: opencity-prototype/build/android/opencity-debug.apk
          
