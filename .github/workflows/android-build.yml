name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export (Debug)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot and Android SDK
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true

          mkdir -p /root/.android
          keytool -genkey -v -keystore /root/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          export ANDROID_HOME=/root/android-sdk
          mkdir -p $ANDROID_HOME
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33" || true

          mkdir -p ~/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/editor_settings-4.tres
          echo '' >> ~/.config/godot/editor_settings-4.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/android_sdk_path = "/root/android-sdk"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore = "/root/debug.keystore"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/editor_settings-4.tres

          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.3.tres

      - name: Build Android APK
        run: |
          cd opencity-prototype
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/opencity-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencity-debug-apk
          path: opencity-prototype/build/android/opencity-debug.apk
          
