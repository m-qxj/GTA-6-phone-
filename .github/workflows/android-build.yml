name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export (Debug)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION} \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}
        env:
          GODOT_VERSION: 4.3.stable

      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Android SDK and Editor Settings
        run: |
          yes | sdkmanager "platform-tools" "build-tools;33.0.2" "platforms;android-33" || true

          PLATFORM_TOOLS_DIR=$(find / -name "platform-tools" -type d 2>/dev/null | head -n 1)
          if [ -n "$PLATFORM_TOOLS_DIR" ]; then
            SDK_PATH=$(dirname "$PLATFORM_TOOLS_DIR")
          else
            SDK_PATH="/root/android-sdk"
          fi

          JDK_PATH="/usr/lib/jvm/java-17-openjdk-amd64"
          if [ ! -d "$JDK_PATH" ]; then
            JDK_PATH="/usr/lib/jvm/java-11-openjdk-amd64"
          fi

          mkdir -p ~/.config/godot
          echo '[gd_resource type="EditorSettings" format=3]' > ~/.config/godot/editor_settings-4.tres
          echo '' >> ~/.config/godot/editor_settings-4.tres
          echo '[resource]' >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/android_sdk_path = \"${SDK_PATH}\"" >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/java_sdk_path = \"${JDK_PATH}\"" >> ~/.config/godot/editor_settings-4.tres
          echo "export/android/jdk_path = \"${JDK_PATH}\"" >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore = "/root/.android/debug.keystore"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_user = "androiddebugkey"' >> ~/.config/godot/editor_settings-4.tres
          echo 'export/android/debug_keystore_pass = "android"' >> ~/.config/godot/editor_settings-4.tres

      - name: Build Android APK
        run: |
          cd opencity-prototype
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/opencity-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencity-debug-apk
          path: opencity-prototype/build/android/opencity-debug.apk
          
