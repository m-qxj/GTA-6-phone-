name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export (Debug)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Android Environment
        env:
          HOME: /root
        run: |
          export ANDROID_HOME=/root/android-sdk
          mkdir -p $ANDROID_HOME
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;33.0.2" "platforms;android-33" || true

          mkdir -p /root/.android
          rm -f /root/debug.keystore
          keytool -genkey -v -keystore /root/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          TMPL_DIR="/root/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TMPL_DIR"
          if [ ! -f "$TMPL_DIR/android_debug.apk" ]; then
            wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            python3 -c "import zipfile; zipfile.ZipFile('Godot_v4.3-stable_export_templates.tpz').extractall('.')"
            cp -r templates/* "$TMPL_DIR/"
            rm -rf templates Godot_v4.3-stable_export_templates.tpz
          fi

          mkdir -p /root/.config/godot
          cat << 'EOF' > /root/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "/root/android-sdk"
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp /root/.config/godot/editor_settings-4.tres /root/.config/godot/editor_settings-4.3.tres

          mkdir -p /github/home/.config/godot /github/home/.local/share/godot /github/home/.android 2>/dev/null || true
          cp -r /root/.config/godot /github/home/.config/ 2>/dev/null || true
          cp -r /root/.local/share/godot/export_templates /github/home/.local/share/godot/ 2>/dev/null || true
          cp /root/debug.keystore /github/home/debug.keystore 2>/dev/null || true

          sed -i 's|^keystore/debug=.*|keystore/debug="/root/debug.keystore"|g' opencity-prototype/export_presets.cfg
          sed -i 's|^keystore/debug_user=.*|keystore/debug_user="androiddebugkey"|g' opencity-prototype/export_presets.cfg
          sed -i 's|^keystore/debug_password=.*|keystore/debug_password="android"|g' opencity-prototype/export_presets.cfg

      - name: Build Android APK
        env:
          HOME: /root
        run: |
          cd opencity-prototype
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/opencity-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencity-debug-apk
          path: opencity-prototype/build/android/opencity-debug.apk
          
