name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export (Debug)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Android SDK Templates and Keystore
        run: |
          keytool -genkey -v -keystore opencity-prototype/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          export ANDROID_HOME=/root/android-sdk
          mkdir -p $ANDROID_HOME
          yes | sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
          sdkmanager --sdk_root=$ANDROID_HOME "platform-tools" "build-tools;33.0.2" "platforms;android-33" || true

          mkdir -p /root/.local/share/godot/export_templates/4.3.stable
          mkdir -p /github/home/.local/share/godot/export_templates/4.3.stable

          if [ -d "/root/.local/share/godot/export_templates/4.3.stable" ]; then
            cp -r /root/.local/share/godot/export_templates/4.3.stable/* /github/home/.local/share/godot/export_templates/4.3.stable/ 2>/dev/null || true
          fi

          if [ ! -f "/github/home/.local/share/godot/export_templates/4.3.stable/android_debug.apk" ]; then
            wget -q https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
            python3 -c "import zipfile; zipfile.ZipFile('Godot_v4.3-stable_export_templates.tpz').extractall('.')"
            cp -r templates/* /github/home/.local/share/godot/export_templates/4.3.stable/
            cp -r templates/* /root/.local/share/godot/export_templates/4.3.stable/
            rm -rf templates Godot_v4.3-stable_export_templates.tpz
          fi

          JAVA_BIN=$(readlink -f $(which java) 2>/dev/null || true)
          if [ -n "$JAVA_BIN" ]; then
            JDK_PATH=$(dirname $(dirname "$JAVA_BIN"))
          else
            JDK_PATH="/usr/lib/jvm/java-17-openjdk-amd64"
          fi

          for CONFIG_DIR in /root/.config/godot /github/home/.config/godot; do
            mkdir -p "$CONFIG_DIR"
            echo '[gd_resource type="EditorSettings" format=3]' > "$CONFIG_DIR/editor_settings-4.tres"
            echo '' >> "$CONFIG_DIR/editor_settings-4.tres"
            echo '[resource]' >> "$CONFIG_DIR/editor_settings-4.tres"
            echo "export/android/android_sdk_path = \"${ANDROID_HOME}\"" >> "$CONFIG_DIR/editor_settings-4.tres"
            echo "export/android/java_sdk_path = \"${JDK_PATH}\"" >> "$CONFIG_DIR/editor_settings-4.tres"
            echo 'export/android/debug_keystore = "debug.keystore"' >> "$CONFIG_DIR/editor_settings-4.tres"
            echo 'export/android/debug_keystore_user = "androiddebugkey"' >> "$CONFIG_DIR/editor_settings-4.tres"
            echo 'export/android/debug_keystore_pass = "android"' >> "$CONFIG_DIR/editor_settings-4.tres"
            cp "$CONFIG_DIR/editor_settings-4.tres" "$CONFIG_DIR/editor_settings-4.3.tres"
          done

      - name: Update export_presets.cfg
        run: |
          python3 -c '
          import re
          path = "opencity-prototype/export_presets.cfg"
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          content = re.sub(r"keystore/debug\s*=.*", "keystore/debug=\"debug.keystore\"", content)
          content = re.sub(r"keystore/debug_user\s*=.*", "keystore/debug_user=\"androiddebugkey\"", content)
          content = re.sub(r"keystore/debug_password\s*=.*", "keystore/debug_password=\"android\"", content)
          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          '

      - name: Build Android APK
        run: |
          cd opencity-prototype
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/opencity-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencity-debug-apk
          path: opencity-prototype/build/android/opencity-debug.apk
          
