name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  export-android:
    name: Android Export (Debug)
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Godot and Android SDK
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/* ~/.local/share/godot/export_templates/ 2>/dev/null || true

          mkdir -p /root/.android /github/home/.android 2>/dev/null || true
          rm -f /root/debug.keystore /github/home/debug.keystore
          keytool -genkey -v -keystore /root/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp /root/debug.keystore /github/home/debug.keystore 2>/dev/null || true

          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;33.0.0" "build-tools;33.0.2" "build-tools;34.0.0" "platforms;android-33" "platforms;android-34" || true

          PLATFORM_TOOLS_DIR=$(find / -name "platform-tools" -type d 2>/dev/null | head -n 1)
          if [ -n "$PLATFORM_TOOLS_DIR" ]; then
            SDK_PATH=$(dirname "$PLATFORM_TOOLS_DIR")
          else
            SDK_PATH="/usr/lib/android-sdk"
          fi

          JAVA_BIN=$(readlink -f $(which java) 2>/dev/null || true)
          if [ -n "$JAVA_BIN" ]; then
            JDK_PATH=$(dirname $(dirname "$JAVA_BIN"))
          else
            JDK_PATH="/usr/lib/jvm/java-17-openjdk-amd64"
          fi

          mkdir -p ~/.config/godot /root/.config/godot /github/home/.config/godot 2>/dev/null || true

          cat << EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${SDK_PATH}"
          export/android/java_sdk_path = "${JDK_PATH}"
          export/android/jdk_path = "${JDK_PATH}"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-4.3.tres
          cp ~/.config/godot/editor_settings-4.tres /root/.config/godot/editor_settings-4.tres 2>/dev/null || true
          cp ~/.config/godot/editor_settings-4.tres /root/.config/godot/editor_settings-4.3.tres 2>/dev/null || true
          cp ~/.config/godot/editor_settings-4.tres /github/home/.config/godot/editor_settings-4.tres 2>/dev/null || true
          cp ~/.config/godot/editor_settings-4.tres /github/home/.config/godot/editor_settings-4.3.tres 2>/dev/null || true

          sed -i 's|keystore/debug=.*|keystore/debug="/root/debug.keystore"|g' opencity-prototype/export_presets.cfg
          sed -i 's|keystore/debug_user=.*|keystore/debug_user="androiddebugkey"|g' opencity-prototype/export_presets.cfg
          sed -i 's|keystore/debug_password=.*|keystore/debug_password="android"|g' opencity-prototype/export_presets.cfg

      - name: Build Android APK
        run: |
          cd opencity-prototype
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/opencity-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencity-debug-apk
          path: opencity-prototype/build/android/opencity-debug.apk
          
